[project]
name = "curb-sdk"
version = "0.0.1"
description = "Curb SDK — guardrail & circuit breaker untuk AI agent (Python)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curb"]
