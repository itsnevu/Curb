name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (with Postgres + Redis)
    runs-on: ubuntu-latest

    # why: these services are what turn the opt-in integration suites ON. Locally they
    # skip themselves; here DATABASE_URL and REDIS_URL are set, so PostgresRepo and
    # RedisRunStateStore are exercised against real servers on every push.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: curb
          POSTGRES_PASSWORD: curb
          POSTGRES_DB: curb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U curb"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://curb:curb@localhost:5432/curb
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Assert the integration suites actually ran
        # why: these suites skip themselves when their env var is missing, so a broken
        # service container would otherwise look like a green build. vitest prints the
        # file path for a passing file, and "skipped" whenever anything was skipped.
        run: |
          set -o pipefail
          pg=$(pnpm --filter @curb/control-plane test 2>&1 | tee /dev/stderr)
          echo "$pg" | grep -q "postgres.test.ts" \
            || { echo "::error::Postgres suite did not run"; exit 1; }

          rd=$(pnpm --filter @curb/policy-engine test 2>&1 | tee /dev/stderr)
          echo "$rd" | grep -q "redis-integration.test.ts" \
            || { echo "::error::Redis suite did not run"; exit 1; }

          if printf '%s\n%s' "$pg" "$rd" | grep -q "skipped"; then
            echo "::error::a suite was skipped even though the services are up"; exit 1
          fi
          echo "Postgres and Redis integration suites both ran, nothing skipped"

      - name: End-to-end demo
        env:
          CURB_DEMO_EXIT: "1"
          GATEWAY_PORT: "0"
          CONTROL_PLANE_PORT: "0"
        run: pnpm exec tsx scripts/demo.ts

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        working-directory: sdks/python
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: sdks/python
        run: python -m pytest -q

  docker:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          cp .env.example .env
          docker compose build

      - name: Boot the full stack
        run: docker compose up -d

      - name: Wait for both services to answer
        run: |
          for svc in "gateway 8080" "control-plane 8090"; do
            set -- $svc
            for i in $(seq 1 40); do
              if curl -fsS "http://localhost:$2/health" >/dev/null 2>&1; then
                echo "$1 is up"; break
              fi
              if [ "$i" = 40 ]; then
                echo "::error::$1 never became healthy"
                docker compose logs "$1"
                exit 1
              fi
              sleep 3
            done
          done

      - name: Smoke test the running stack
        run: |
          set -euo pipefail
          KEY=$(grep '^CURB_API_KEY=' .env | cut -d= -f2)

          # auth is enforced
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8090/v1/policies)" = 401

          # the dashboard is reachable and carries no credential
          page=$(curl -fsS localhost:8090/)
          echo "$page" | grep -q "Approval queue"
          if echo "$page" | grep -q "$KEY"; then
            echo "::error::dashboard leaked the API key"; exit 1
          fi

          # a policy created through the API is enforced by the Decision API
          curl -fsS -X POST localhost:8090/v1/policies \
            -H "x-curb-key: $KEY" -H 'content-type: application/json' \
            -d '{"name":"ci deny","type":"tool_permission","action":"deny","scope":{},
                 "enabled":true,"params":{"tools":["wipe_db"],"mode":"deny"}}' >/dev/null

          effect=$(curl -fsS -X POST localhost:8090/v1/decisions \
            -H "x-curb-key: $KEY" -H 'content-type: application/json' \
            -d '{"kind":"tool_call","runId":"ci-run","toolName":"wipe_db"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["effect"])')
          test "$effect" = "DENY" || { echo "::error::expected DENY, got $effect"; exit 1; }

          echo "stack smoke test passed"

      - name: Service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
