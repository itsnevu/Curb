services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: curb
      POSTGRES_PASSWORD: curb
      POSTGRES_DB: curb
    ports: ["5432:5432"]
    volumes: ["curb_pg:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  gateway:
    build: { context: ., dockerfile: apps/gateway/Dockerfile }
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [redis]

  control-plane:
    build: { context: ., dockerfile: apps/control-plane/Dockerfile }
    env_file: .env
    ports: ["8090:8090"]
    depends_on: [postgres, redis]

volumes:
  curb_pg:
